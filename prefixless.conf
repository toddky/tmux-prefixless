# vi: filetype=tmux
# Loaded by prefixless.tmux, which sets @prefixless-dir to this plugin's directory first.
# Script bindings expand #{q:@prefixless-dir} when the key is pressed, so the path may contain spaces.

# ==============================================================================
# CLIENT
# ==============================================================================
bind-key -T prefixless M-Q detach-client


# ==============================================================================
# NAVIGATION
# ==============================================================================

# Choose a session
bind-key -T prefixless M-a choose-session -O name
bind-key -T prefixless M-A run-shell 'tmux-switch pane'

# Switch to next/previous session with <M-S-j/k>
bind-key -T prefixless M-J switch-client -n
bind-key -T prefixless M-K switch-client -p

# Switch to last session
bind-key -T prefixless M-_ switch-client -l

# Switch to next/previous window with <M-S-h/l>
bind-key -T prefixless M-< previous-window
bind-key -T prefixless M-> next-window
bind-key -T prefixless M-H previous-window
bind-key -T prefixless M-L next-window

# Switch to last window
bind-key -T prefixless M-- select-window -l

# Select Windows <M-#>
bind-key -T prefixless M-1 select-window -t 1
bind-key -T prefixless M-2 select-window -t 2
bind-key -T prefixless M-3 select-window -t 3
bind-key -T prefixless M-4 select-window -t 4
bind-key -T prefixless M-5 select-window -t 5
bind-key -T prefixless M-6 select-window -t 6
bind-key -T prefixless M-7 select-window -t 7
bind-key -T prefixless M-8 select-window -t 8
bind-key -T prefixless M-9 select-window -t 9
bind-key -T prefixless M-0 select-window -t 10

# Switch panes with <M-h/j/k/l>
# 2026-11-05: Bound directly, not via scripts/run; forking a script per keypress took 100+ ms on network filesystems.
bind-key -T prefixless M-k resize-pane -y 1 \; select-pane -U \; resize-pane -y 999
bind-key -T prefixless M-j resize-pane -y 1 \; select-pane -D \; resize-pane -y 999
bind-key -T prefixless M-h select-pane -L
bind-key -T prefixless M-l select-pane -R

# Toggle zoom <M-f>
bind-key -T prefixless M-f resize-pane -Z

# Toggle status <M-F>
bind-key -T prefixless M-F run-shell '#{q:@prefixless-dir}/scripts/run toggle-status'

# Notification chooser
bind-key -T prefixless M-u run-shell '#{q:@prefixless-dir}/scripts/run notify-choose'

# Agent chat chooser
bind-key -T prefixless M-U run-shell '#{q:@prefixless-dir}/scripts/run chat-choose'


# ==============================================================================
# SESSION
# ==============================================================================

# Rename session with <M-R>
bind-key -T prefixless M-R command-prompt 'rename-session %%'

# I no longer kill windows, instead I kill each pane individually
# Close window <M-Shift-W>
#bind-key -T prefixless M-W confirm-before -p "kill-window #W? (y/n)" kill-window
#bind-key -T prefixless M-W kill-window

# New pane with <M-S/s/V/v>
bind-key -T prefixless M-S split-window -vf -c '#{pane_current_path}' \; resize-pane -y 999
bind-key -T prefixless M-s split-window -v  -c '#{pane_current_path}' \; resize-pane -y 999
bind-key -T prefixless M-V split-window -hf -c '#{pane_current_path}'
bind-key -T prefixless M-v split-window -h  -c '#{pane_current_path}'

# Resize pane with <M-Arrow>
bind-key -T prefixless M-Left  resize-pane -L
bind-key -T prefixless M-Right resize-pane -R
bind-key -T prefixless M-Up    resize-pane -U
bind-key -T prefixless M-Down  resize-pane -D

# Swap pane with pane above/below with <M-PageUp/PageDown>
bind-key -T prefixless M-PPage swap-pane -U \; resize-pane -y 999
bind-key -T prefixless M-NPage swap-pane -D \; resize-pane -y 999

# Kill pane using kill-pane.bash
# kill-pane.bash prevents killing panes if certain processes are running
bind-key -T prefixless M-w run-shell '#{q:@prefixless-dir}/scripts/run kill-pane'

# Force kill pane
bind-key -T prefixless M-W kill-pane \; resize-pane -y 999


# ==============================================================================
# WINDOWS
# ==============================================================================

# New/rename/swap window with <M-N/r/S-Left/S-Right>
bind-key -T prefixless M-N       run-shell -b '#{q:@prefixless-dir}/scripts/run new-window-menu'
bind-key -T prefixless M-n       run-shell -b '#{q:@prefixless-dir}/scripts/run new-window'
bind-key -T prefixless S-M-Left  swap-window -t -1 \; select-window -t -1
bind-key -T prefixless S-M-Right swap-window -t +1 \; select-window -t +1
bind-key -T prefixless M-r       command-prompt 'rename-window %%'

# Synchronize panes on/off with with <M-Z/z>
bind-key -T prefixless M-Z set-window-option synchronize-panes on
bind-key -T prefixless M-z set-window-option synchronize-panes off

# Make layout even with <M-=>
bind-key -T prefixless M-= select-layout -E


# ==============================================================================
# PANES
# ==============================================================================

# Copy pane directory <M-d>
bind-key -T prefixless M-d run-shell -b "printf '%s\\n' #{q:pane_current_path} | #{q:@prefixless-dir}/scripts/run copy-pipe"

# Mark pane <M-m>
bind-key -T prefixless M-m select-pane -m

# Toggle input <M-x>
bind-key -T prefixless M-x if-shell -F '#{pane_input_off}' 'select-pane -e' 'select-pane -d'


# ==============================================================================
# SCRATCHPAD
# ==============================================================================
# Zoomed-split scratch panes close and restore the layout when the command exits; popups lie exactly over the pane.
# remain-on-exit is on globally, so each scratch pane turns it off for itself.

# Run a command <M-O>
bind-key -T prefixless M-O command-prompt -p "[scratchpad] Enter command:" { split-window -h -c "#{pane_current_path}" "%%" ; set-option -p remain-on-exit off ; resize-pane -Z }

# Open pane history in Neovim <M-o>, in a popup laid over the pane.
bind-key -T prefixless M-o run-shell '#{q:@prefixless-dir}/scripts/run scratchpad/popup "\"\$PREFIXLESS_DIR/scripts/run\" scratchpad/capture -t #{pane_id} 2>&1 | nvim -"'

# Yank <M-y>; a popup laid over the pane keeps the hints lined up with the text on screen.
bind-key -T prefixless M-y run-shell '#{q:@prefixless-dir}/scripts/run scratchpad/popup "\"\$PREFIXLESS_DIR/scripts/run\" scratchpad/yank.py -t #{pane_id}"'


# ==============================================================================
# COPY-MODE-VI
# ==============================================================================
set-window-option -g mode-keys vi

# Enter copy mode
bind-key -T prefixless M-Y copy-mode

# Select from paste-buffer
bind-key -T prefixless M-P choose-buffer "paste-buffer -b %%"

# Copy Selection to System Clipboard <y>
bind-key -T copy-mode-vi y send-keys -X copy-pipe '#{q:@prefixless-dir}/scripts/run copy-pipe'

# Select <v>
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Select using rectangle mode <C-v>
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Page up/down <K/J>
bind-key -T copy-mode-vi K   run-shell -b '#{q:@prefixless-dir}/scripts/run smooth-scroll up 5'
bind-key -T copy-mode-vi J   run-shell -b '#{q:@prefixless-dir}/scripts/run smooth-scroll down 5'
bind-key -T copy-mode-vi C-u run-shell -b '#{q:@prefixless-dir}/scripts/run smooth-scroll up half'
bind-key -T copy-mode-vi C-d run-shell -b '#{q:@prefixless-dir}/scripts/run smooth-scroll down half'

# End of Line <L>
bind-key -T copy-mode-vi L send-keys -X end-of-line

# Start of Line <H>
bind-key -T copy-mode-vi H send-keys -X start-of-line


# ==============================================================================
# MISC
# ==============================================================================

# Open chat popup <M-Space>; older tmux has no display-popup, so the key stays unbound there.
# The version is compared as text, which holds until a 3.10 release.
%if "#{>=:#{version},3.2}"
bind-key -T prefixless M-Space display-popup -E -w 85% -h 85% tmux-m-space
%endif

# Reload tmux config <M-F5>; setup.sh always installs it here.
bind-key -T prefixless M-F5 source-file ~/.config/tmux/tmux.conf

bind-key -T prefixless M-: command-prompt


# ==============================================================================
# SET KEY-TABLE
# ==============================================================================
set-option -gs key-table prefixless

# Enter prefixless with <M-i>, exit it with <M-I>
bind-key -T root       M-i set-option -gs key-table prefixless
bind-key -T prefixless M-I set-option -gs key-table root

